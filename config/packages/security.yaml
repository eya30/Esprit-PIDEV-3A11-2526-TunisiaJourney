security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_USER]
        ROLE_ADMIN:       [ROLE_MEMBRE, ROLE_USER]
        ROLE_MEMBRE:      [ROLE_USER]

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginFormAuthenticator

            logout:
                path: app_logout
                target: app_accueil
                csrf_token_id: logout
                csrf_parameter: _token

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        # ✅ PUBLIC
        - { path: '^/login', roles: PUBLIC_ACCESS }
        - { path: '^/register', roles: PUBLIC_ACCESS }

        # ✅ 🔥 AJOUT IMPORTANT (corrige ton bug)
        - { path: '^/reservation', roles: PUBLIC_ACCESS }

        # ✅ ADMIN
        - { path: '^/admin', roles: ROLE_ADMIN }
        - { path: '^/admin/dashboard', roles: ROLE_ADMIN }
        - { path: '^/admin/voyages', roles: ROLE_ADMIN }
        - { path: '^/admin/programmes', roles: ROLE_ADMIN }
        - { path: '^/admin/reservations', roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
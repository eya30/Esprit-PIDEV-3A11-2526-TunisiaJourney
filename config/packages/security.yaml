security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_USER]
        ROLE_ADMIN:       [ROLE_MEMBRE, ROLE_USER]
        ROLE_MEMBRE:      [ROLE_USER]

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\LoginFormAuthenticator
                - App\Security\GoogleAuthenticator
            entry_point: App\Security\LoginFormAuthenticator
            logout:
                path: app_logout
                target: app_accueil
                csrf_token_id: logout
                csrf_parameter: _token
                invalidate_session: true
                delete_cookies:
                    PHPSESSID: ~
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        - { path: ^/face-login,        roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password,   roles: PUBLIC_ACCESS }
        - { path: ^/reset-password,    roles: PUBLIC_ACCESS }
        - { path: '^/login',           roles: PUBLIC_ACCESS }
        - { path: '^/register',        roles: PUBLIC_ACCESS }
        - { path: '^/2fa/check',       roles: PUBLIC_ACCESS }   # ← 2FA check public
        - { path: '^/connect/google',  roles: PUBLIC_ACCESS }
        - { path: '^/admin',           roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Paramètres de HEAD (événements et activités)
    uploads_directory: '%kernel.project_dir%/public/uploads/evenements'
    uploads_activites_directory: '%kernel.project_dir%/public/uploads/activites'
    produits_directory: '%kernel.project_dir%/public/uploads/produits'
    
    # Paramètres de origin/devvvvv (voyages, programmes, APIs)
    voyages_images_directory: '%kernel.project_dir%/public/uploads/voyages'
    programmes_images_directory: '%kernel.project_dir%/public/uploads/programmes'
    uploads_voyages_directory: '%kernel.project_dir%/public/uploads/voyages'
    uploads_programmes_directory: '%kernel.project_dir%/public/uploads/programmes'
    imgbb_api_key: '%env(IMGBB_API_KEY)%'
    recaptcha_site_key: '%env(RECAPTCHA_SITE_KEY)%'
    recaptcha_secret_key: '%env(RECAPTCHA_SECRET_KEY)%'
    FACE_API_KEY: '%env(FACE_API_KEY)%'
    FACE_API_SECRET: '%env(FACE_API_SECRET)%'
    brevo_api_key: '%env(BREVO_API_KEY)%'
    brevo_sender_email: '%env(BREVO_SENDER_EMAIL)%'
    stripe_public_key: '%env(STRIPE_PUBLIC_KEY)%'
    stripe_secret_key: '%env(STRIPE_SECRET_KEY)%'
    gemini_api_key: '%env(GEMINII_API_KEY)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Service de HEAD
    App\Service\AISummaryService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Services de origin/devvvvv
    App\Service\GeminiAIService:
        arguments:
            $apiKey: '%env(GEMINI_API_KEY)%'
            $connection: '@doctrine.dbal.default_connection'
            
    App\Service\StripeService:
        arguments:
            $stripeSecretKey: '%env(STRIPE_SECRET_KEY)%'
            $stripePublicKey: '%env(STRIPE_PUBLIC_KEY)%'
            $logger: '@logger'
            $entityManager: '@doctrine.orm.entity_manager'
   
    App\Service\DiscordNotifierService:
        arguments:
            $connection: '@doctrine.dbal.default_connection'
            $logger: '@logger'
            
    App\EventListener\DiscordNewReservationListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest }
    App\Service\GeminiEAIService:
        arguments:
            $apiKey: '%env(GEMINII_API_KEY)%'
            $connection: '@doctrine.dbal.default_connection'

    # ✅ StripeService avec injection des clés depuis les paramètres
    App\Service\StripeeService:
        arguments:
            $secretKey: '%env(STRIPEE_SECRET_KEY)%'
            $publicKey: '%env(STRIPEE_PUBLIC_KEY)%'
        public: true

    # ✅ WhatsAppService - CORRIGÉ (indentation)
    App\Service\WhatsAppService:
        arguments:
            $accountSid: '%env(TWILIO_ACCOUNT_SID)%'
            $authToken: '%env(TWILIO_AUTH_TOKEN)%'
            $fromNumber: '%env(TWILIO_WHATSAPP_NUMBER)%'
   # Ajoutez cette ligne dans la section services
    App\Service\BrevoEmailService:
        arguments:
            $httpClient: '@http_client'
            $logger: '@logger'
    # SMS Service avec Twilio   
    App\Service\SmsService:
        arguments:
            $accountSid: '%env(TWILIO_ACCOUNT_SID)%'
            $authToken: '%env(TWILIO_AUTH_TOKEN)%'
            $twilioPhoneNumber: '%env(TWILIO_PHONE_NUMBER)%'

